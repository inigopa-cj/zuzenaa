name: zuzenaa

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuzenaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuzenaa}
      POSTGRES_DB: ${POSTGRES_DB:-zuzenaa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zuzenaa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      ZUZENAA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zuzenaa}:${POSTGRES_PASSWORD:-zuzenaa}@db:5432/${POSTGRES_DB:-zuzenaa}
      ZUZENAA_DATA_ROOT: /data
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: runtime
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  data:
