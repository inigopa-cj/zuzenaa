name: zuzenaa-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuzenaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuzenaa}
      POSTGRES_DB: ${POSTGRES_DB:-zuzenaa}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zuzenaa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      ZUZENAA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zuzenaa}:${POSTGRES_PASSWORD:-zuzenaa}@db:5432/${POSTGRES_DB:-zuzenaa}
      ZUZENAA_DEBUG: "true"
      ZUZENAA_DATA_ROOT: /data
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - data-dev:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    ports:
      - "5173:5173"

volumes:
  pgdata-dev:
  data-dev:
